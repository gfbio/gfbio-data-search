<div class="changelog-container">
  <header class="changelog-hero">
    <h1>Changelog</h1>
    <p>Track the evolution of GFBio Search through our release history</p>
  </header>

  <div class="timeline">
    <div class="timeline-entry" *ngFor="let entry of changelogEntries">
      <div class="timeline-dot"></div>
      <div class="timeline-card">
        <div class="version-head">
          <h2 class="version-number">v{{ entry.version }}</h2>
          <span class="version-date">{{ entry.date }}</span>
        </div>
        <h3 class="whats-new">What's New</h3>
        <ul class="change-list">
          <li *ngFor="let change of entry.changes" class="change-item">{{ change }}</li>
        </ul>
      </div>
    </div>
  </div>
</div>
